modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

# 声明 Access Transformer 文件位置
accessTransformer="META-INF/accesstransformer.cfg"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''Astral Potion - 魂体/灵息药水模组'''

[[dependencies.${mod_id}]]
modId="neoforge"
mandatory=true
versionRange="${neo_version}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[mixins]]
config = "astralpotion.mixins.json"